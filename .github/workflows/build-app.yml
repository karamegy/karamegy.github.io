name: Build TWA (AAB and APK)

on:
  workflow_dispatch: # للتشغيل اليدوي من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode Signing Keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > ./signing.keystore

      - name: Setup Android SDK Packages & Permissions
        run: |
          # منح صلاحيات الكتابة الكاملة للمستخدم على مجلد Android SDK
          sudo chown -R $USER:$USER $ANDROID_HOME
          
          # قبول التراخيص وتثبيت حزمة نظام أندرويد 34 رسمياً
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          
          # ربط المسارات بملف تكوين Bubblewrap
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"${JAVA_HOME}\",\"androidSdkPath\":\"${ANDROID_HOME}\"}" > ~/.bubblewrap/config.json

      - name: Build Android App (AAB & APK)
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bubblewrap build --skipVersionUpgrade

      - name: Upload App Artifacts (AAB & APK)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-files
          path: |
            *.aab
            *.apk
            **/build/outputs/apk/release/*.apk
            **/build/outputs/bundle/release/*.aab
