name: Build TWA (AAB and APK)

on:
  workflow_dispatch: # للتشغيل اليدوي من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode Signing Keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > ./signing.keystore

      - name: Build Android App Bundle (.aab)
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bubblewrap update --skipVersionUpgrade
          echo "n" | bubblewrap build

      - name: Build APK file
        env:
          ORG_GRADLE_PROJECT_signingKeyStorePath: ../signing.keystore
          ORG_GRADLE_PROJECT_signingKeyAlias: my-key-alias
          ORG_GRADLE_PROJECT_signingKeyPassword: ${{ secrets.KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease
          elif [ -d "android" ]; then
            cd android
            chmod +x ./gradlew
            ./gradlew assembleRelease
          fi

      - name: Upload App Artifacts (AAB & APK)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-files
          path: |
            *.aab
            app/build/outputs/apk/release/*.apk
            **/build/outputs/apk/release/*.apk
