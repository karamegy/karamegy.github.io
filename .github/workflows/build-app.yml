name: Build TWA (AAB and APK)

on:
  workflow_dispatch: # للتشغيل اليدوي من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode Signing Keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > ./signing.keystore

      - name: Setup Android SDK & Config
        run: |
          sudo chown -R $USER:$USER $ANDROID_HOME
          printf 'y\ny\ny\ny\ny\ny\ny\n' | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

      - name: Build APK and AAB via Gradle
        env:
          ORG_GRADLE_PROJECT_signingKeyStorePath: ../signing.keystore
          ORG_GRADLE_PROJECT_signingKeyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_signingKeyPassword: ${{ secrets.KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # تحديث المشروع
          bubblewrap update --skipVersionUpgrade || true

          # رفع إصدار minSdk إلى 24 لتوافق المكتبات الحديثة وتجنب الفشل
          find . -name "build.gradle" -type f -exec sed -i 's/minSdkVersion\s*[0-9]\+/minSdkVersion 24/g' {} +
          find . -name "build.gradle" -type f -exec sed -i 's/minSdk\s*=\s*[0-9]\+/minSdk = 24/g' {} +

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew bundleRelease assembleRelease
          elif [ -d "android" ]; then
            cd android
            chmod +x ./gradlew
            ./gradlew bundleRelease assembleRelease
          fi

      - name: Upload App Artifacts (AAB & APK)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-files
          path: |
            *.aab
            *.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            **/build/outputs/bundle/release/*.aab
            **/build/outputs/apk/release/*.apk
